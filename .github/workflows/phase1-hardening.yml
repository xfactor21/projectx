name: project.X Phase 1 Hardening

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/phase1-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply phase 1 fixes
        shell: pwsh
        run: |
          python scripts/phase1_patch.py
          git rm -f projectx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Native tests
        working-directory: src-tauri
        run: cargo test

      - name: Commit phase 1
        shell: pwsh
        run: |
          git config user.name "project.X Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "security: complete phase 1 hardening"
          git push origin HEAD:develop
