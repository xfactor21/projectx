name: Build VoiceStudioX v27.1 Debug APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v6

      - name: Reconstruct sanitized Android source
        shell: bash
        run: |
          cat .vsx-ci3/source3.b64.* > /tmp/vsx.b64
          echo "d998941512a07cbff4b22db24485eb06fb216d38f855f9e1c87e81560f6543bd  /tmp/vsx.b64" | sha256sum -c -
          base64 --decode /tmp/vsx.b64 > /tmp/vsx.zip
          echo "4feb9398e6cf737030c3f3c5ed29a49455538426747ecba16d4bd235e1c1f65a  /tmp/vsx.zip" | sha256sum -c -
          unzip -t /tmp/vsx.zip >/dev/null
          mkdir -p /tmp/vsx
          unzip -q /tmp/vsx.zip -d /tmp/vsx
          test -f /tmp/vsx/android/app/build.gradle
          grep -q 'versionCode 271' /tmp/vsx/android/app/build.gradle
          grep -q 'versionName "27.1.0"' /tmp/vsx/android/app/build.gradle

      - name: Create lightweight debug artwork
        shell: bash
        run: |
          PNG='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          RES=/tmp/vsx/android/app/src/main/res
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$d"
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              printf '%s' "$PNG" | base64 --decode > "$RES/$d/$f"
            done
          done
          for orient in port land; do
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              d="drawable-${orient}-${density}"
              mkdir -p "$RES/$d"
              printf '%s' "$PNG" | base64 --decode > "$RES/$d/splash.png"
            done
          done
          mkdir -p "$RES/drawable"
          printf '%s' "$PNG" | base64 --decode > "$RES/drawable/splash.png"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Install Capacitor Android
        working-directory: /tmp/vsx
        run: npm install --no-audit --no-fund

      - name: Build debug APK
        working-directory: /tmp/vsx/android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f /tmp/vsx/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/vsx/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/vsx/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStudioX-v27.1-debug-apk
          path: /tmp/vsx/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
