name: project.X v2.9 Cloud Activity Completion

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.event.head_commit.message == 'audit runner execute cloud activity completion' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/cloud_activity_v29.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'xFactor'
          git config user.email 'xfactorxai@gmail.com'
          git add src tests README.md
          git commit -m 'audit: complete cloud-backed Activity surface'
          git push origin HEAD:develop
