name: project.X Companion Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - mobile/android-companion-build
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'resources/**'
      - '.github/workflows/android-companion.yml'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: projectx-companion-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECTX_BUILD_NAME: projectX-08.30-v2.9-theme-connections
  PROJECTX_ANDROID_VERSION: 2.9.0
  PROJECTX_ANDROID_VERSION_CODE: 20700
  CAPACITOR_VERSION: 8.5.1
  CAPACITOR_ASSETS_VERSION: 3.0.5

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Install pinned Capacitor build tools
        run: npm install --no-save "@capacitor/core@${CAPACITOR_VERSION}" "@capacitor/cli@${CAPACITOR_VERSION}" "@capacitor/android@${CAPACITOR_VERSION}" "@capacitor/assets@${CAPACITOR_ASSETS_VERSION}"

      - name: Regression tests
        run: npm test

      - name: Validate managed cloud configuration
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL repository secret.'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing VITE_SUPABASE_PUBLISHABLE_KEY repository secret.'; exit 1; }

      - name: Build Companion web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Create Android shell
        run: npx cap add android

      - name: Apply project.X Android branding
        run: npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor '#05060a' --iconBackgroundColorDark '#05060a' --splashBackgroundColor '#05060a' --splashBackgroundColorDark '#05060a'

      - name: Sync Companion bundle
        run: npx cap sync android

      - name: Set Android app version
        shell: bash
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${PROJECTX_ANDROID_VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${PROJECTX_ANDROID_VERSION}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Build Android APK
        shell: bash
        env:
          PROJECTX_ANDROID_KEYSTORE_BASE64: ${{ secrets.PROJECTX_ANDROID_KEYSTORE_BASE64 }}
          PROJECTX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PROJECTX_ANDROID_KEYSTORE_PASSWORD }}
          PROJECTX_ANDROID_KEY_ALIAS: ${{ secrets.PROJECTX_ANDROID_KEY_ALIAS }}
          PROJECTX_ANDROID_KEY_PASSWORD: ${{ secrets.PROJECTX_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          if [ -n "${PROJECTX_ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${PROJECTX_ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${PROJECTX_ANDROID_KEY_ALIAS:-}" ] && [ -n "${PROJECTX_ANDROID_KEY_PASSWORD:-}" ]; then
            echo "$PROJECTX_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/projectx-release.jks"
            (cd android && ./gradlew assembleRelease)
            UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
            if [ ! -f "$UNSIGNED" ]; then UNSIGNED="android/app/build/outputs/apk/release/app-release.apk"; fi
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            test -x "$APKSIGNER" || { echo 'Android apksigner was not found.'; exit 1; }
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/projectx-release.jks" --ks-key-alias "$PROJECTX_ANDROID_KEY_ALIAS" --ks-pass "pass:$PROJECTX_ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$PROJECTX_ANDROID_KEY_PASSWORD" --out "${PROJECTX_BUILD_NAME}.apk" "$UNSIGNED"
            "$APKSIGNER" verify --verbose "${PROJECTX_BUILD_NAME}.apk"
            echo "PROJECTX_ANDROID_ARTIFACT_KIND=signed-release" >> "$GITHUB_ENV"
          else
            (cd android && ./gradlew assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk "${PROJECTX_BUILD_NAME}.apk"
            echo "PROJECTX_ANDROID_ARTIFACT_KIND=debug" >> "$GITHUB_ENV"
            echo 'Release signing secrets are not configured; publishing a debug APK for internal testing.'
          fi

      - name: Upload Companion APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PROJECTX_BUILD_NAME }}-android-${{ env.PROJECTX_ANDROID_ARTIFACT_KIND }}
          path: ${{ env.PROJECTX_BUILD_NAME }}.apk
          if-no-files-found: error
