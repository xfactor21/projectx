name: project.X Companion Android

on:
  workflow_dispatch:
  push:
    branches:
      - mobile/android-companion-build
  pull_request:
    branches:
      - develop

concurrency:
  group: projectx-companion-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor build tools
        run: npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build Companion web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Create Android shell
        run: npx cap add android

      - name: Sync Companion bundle
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Companion APK
        uses: actions/upload-artifact@v4
        with:
          name: projectX-companion-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
