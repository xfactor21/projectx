name: project.X Phase 2 Mobile + Themes

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/phase2-mobile-themes.yml'
      - 'scripts/phase2_patch.py'

permissions:
  contents: write

jobs:
  phase2:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply phase 2 fixes
        run: python scripts/phase2_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Commit phase 2
        shell: pwsh
        run: |
          git config user.name "project.X Phase 2"
          git config user.email "actions@users.noreply.github.com"
          git add src/CompanionApp.tsx src/WorkspaceAppV3.tsx src/ThemeProjectRenderer.tsx src/ThemeEnvironmentLayer.tsx src/ThemeSensoryLayer.tsx src/services/workspaceBackup.ts src/main.tsx src/phase2Themes.css
          git commit -m "feat: improve Android ZIP handoff and add premium themes"
          git push origin HEAD:develop
